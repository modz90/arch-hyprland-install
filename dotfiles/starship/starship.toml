format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style             = "bold cyan"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold blue"
symbol = " "

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
style    = "bold yellow"
format   = "took [$duration]($style) "
