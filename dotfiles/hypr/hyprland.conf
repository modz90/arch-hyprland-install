# Hyprland config — Intel Celeron N4020, UHD 600, 4 GB RAM

source = ~/.config/hypr/conf.d/monitor.conf
source = ~/.config/hypr/conf.d/startup.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/appearance.conf
source = ~/.config/hypr/conf.d/colors.conf
source = ~/.config/hypr/conf.d/keybinds.conf

# ── Plugins ───────────────────────────────────────────────────────────────────

plugin {
    hyprexpo {
        columns        = 3
        gap_size       = 8
        bg_col         = rgb(0a0a0f)
        workspace_method = center current

        enable_gesture    = true
        gesture_fingers   = 4
        gesture_distance  = 300
        gesture_positive  = true
    }
}
