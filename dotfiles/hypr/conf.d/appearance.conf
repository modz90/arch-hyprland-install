general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(88c0d0ff)
    col.inactive_border = rgba(4c566aff)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = false   # save GPU on UHD 600
    }
    screen_shader = ~/.config/hypr/shaders/anti-flashbang.glsl
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, smooth
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}
