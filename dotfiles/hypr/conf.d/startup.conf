# Autostart
exec-once = waybar
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = hyprsunset

# Variables
$terminal    = kitty
$launcher    = fuzzel
$fileManager = thunar
$browser     = firefox
$codeEditor  = code

# Environment
env = LIBVA_DRIVER_NAME,i965
env = WLR_DRM_NO_ATOMIC,1        # needed on older Intel iGPUs
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
