$mod = SUPER

# ── Terminal ──────────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, T,      exec, $terminal
bind = Ctrl+Alt, T,  exec, $terminal

# ── Launcher ──────────────────────────────────────────────────────────────────
bind = $mod, R, exec, $launcher

# ── Apps ──────────────────────────────────────────────────────────────────────
bind = $mod, E, exec, $fileManager
bind = $mod, W, exec, $browser
bind = $mod, C, exec, $codeEditor

# ── Window management ─────────────────────────────────────────────────────────
bind  = $mod,       Q,     killactive
bind  = Alt,        F4,    killactive
bind  = $mod,       F,     fullscreen, 0
bind  = $mod,       D,     fullscreen, 1
bind  = $mod+Alt,   Space, togglefloating
bind  = $mod,       P,     pin
bind  = $mod,       M,     exit

# ── Focus ─────────────────────────────────────────────────────────────────────
bind = $mod, Left,  movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up,    movefocus, u
bind = $mod, Down,  movefocus, d

# ── Move windows ──────────────────────────────────────────────────────────────
bind = $mod+Shift, Left,  movewindow, l
bind = $mod+Shift, Right, movewindow, r
bind = $mod+Shift, Up,    movewindow, u
bind = $mod+Shift, Down,  movewindow, d

# ── Resize ────────────────────────────────────────────────────────────────────
binde = $mod, Semicolon,  layoutmsg, splitratio -0.1
binde = $mod, Apostrophe, layoutmsg, splitratio +0.1

# ── Mouse ─────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Workspaces ────────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod+Shift, 1, movetoworkspace, 1
bind = $mod+Shift, 2, movetoworkspace, 2
bind = $mod+Shift, 3, movetoworkspace, 3
bind = $mod+Shift, 4, movetoworkspace, 4
bind = $mod+Shift, 5, movetoworkspace, 5

bind = $mod+Alt, 1, movetoworkspacesilent, 1
bind = $mod+Alt, 2, movetoworkspacesilent, 2
bind = $mod+Alt, 3, movetoworkspacesilent, 3
bind = $mod+Alt, 4, movetoworkspacesilent, 4
bind = $mod+Alt, 5, movetoworkspacesilent, 5

bind = Ctrl+$mod,       Right,      workspace, r+1
bind = Ctrl+$mod,       Left,       workspace, r-1
bind = $mod,            Page_Down,  workspace, +1
bind = $mod,            Page_Up,    workspace, -1
bind = $mod,            mouse_up,   workspace, +1
bind = $mod,            mouse_down, workspace, -1

# ── Special workspace (scratchpad) ────────────────────────────────────────────
bind = $mod,     S,     togglespecialworkspace
bind = $mod+Alt, S,     movetoworkspacesilent, special
bind = Ctrl+$mod, S,    togglespecialworkspace

# ── Overview (hyprexpo) ───────────────────────────────────────────────────────
bind = $mod, Tab, hyprexpo:expo, toggle

# ── Notification center ───────────────────────────────────────────────────────
bind = $mod,       N,     exec, swaync-client -t
bind = $mod+Shift, N,     exec, swaync-client -d

# ── Dock ─────────────────────────────────────────────────────────────────────
bind = $mod, grave, exec, pkill nwg-dock-hyprland || nwg-dock-hyprland -p bottom -i 48 -mb 8 -d -nolauncher -css ~/.config/nwg-dock/style.css

# ── Wallpaper ────────────────────────────────────────────────────────────────
bind = $mod+Shift,     W, exec, ~/.config/hypr/scripts/fetch-anime-wallpaper.sh
bind = $mod+Ctrl+Shift, W, exec, ~/.config/hypr/scripts/fetch-anime-wallpaper.sh --nsfw

# ── Lock & session ────────────────────────────────────────────────────────────
bind  = $mod,       L, exec, hyprlock
bindl = $mod+Shift, L, exec, systemctl suspend

# ── Clipboard ─────────────────────────────────────────────────────────────────
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# ── Screenshots ───────────────────────────────────────────────────────────────
bind = ,             Print,   exec, hyprshot -m output
bind = $mod,         Print,   exec, hyprshot -m region
bind = $mod+Shift,   S,       exec, hyprshot --freeze --clipboard-only --mode region --silent
bind = $mod+Shift,   Print,   exec, hyprshot -m window
bind = $mod+Alt,     S,       exec, hyprshot -m region --raw | swappy -f -

# ── Screen recording ──────────────────────────────────────────────────────────
bind = $mod+Shift, R, exec, ~/.config/hypr/scripts/record-toggle.sh

# ── OCR ───────────────────────────────────────────────────────────────────────
bind = $mod+Shift, X, exec, grim -g "$(slurp)" /tmp/ocr.png && tesseract /tmp/ocr.png stdout | wl-copy && rm /tmp/ocr.png

# ── Volume mixer ──────────────────────────────────────────────────────────────
bind = Ctrl+$mod, V, exec, pavucontrol-qt

# ── Color picker ──────────────────────────────────────────────────────────────
bind = $mod+Shift, C, exec, hyprpicker -a

# ── Volume ────────────────────────────────────────────────────────────────────
bindle = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume 2
bindle = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindl  = $mod+Alt, M,            exec, swayosd-client --input-volume mute-toggle

# ── Brightness ────────────────────────────────────────────────────────────────
bindle = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindle = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# ── Media ─────────────────────────────────────────────────────────────────────
bindl = , XF86AudioPlay,   exec, playerctl play-pause
bindl = , XF86AudioPause,  exec, playerctl play-pause
bindl = , XF86AudioNext,   exec, playerctl next
bindl = , XF86AudioPrev,   exec, playerctl previous
bindl = $mod+Shift, P,     exec, playerctl play-pause
bindl = $mod+Shift, N,     exec, playerctl next
bindl = $mod+Shift, B,     exec, playerctl previous
