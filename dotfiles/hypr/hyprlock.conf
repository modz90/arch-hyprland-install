background {
    monitor =
    path = screenshot
    blur_passes = 1
    blur_size    = 4
    brightness   = 0.5
    contrast     = 0.9
}

# ── Clock ─────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(216, 222, 233, 1.0)
    font-size   = 72
    font-family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %-d")"
    color = rgba(163, 177, 199, 0.9)
    font-size   = 18
    font-family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 280, 48
    outline-thickness = 2
    dots-size    = 0.28
    dots-spacing = 0.3
    outer-color  = rgb(76, 86, 106)
    inner-color  = rgba(46, 52, 64, 0.85)
    font-color   = rgb(216, 222, 233)
    fade-on-empty = false
    placeholder-text = <i>Password…</i>
    check-color  = rgb(163, 190, 140)
    fail-color   = rgb(191, 97, 106)
    fail-text    = <i>$FAIL ($ATTEMPTS)</i>
    capslock-color = rgb(235, 203, 139)
    position = 0, -60
    halign = center
    valign = center
    rounding = 12
}

# ── Greeting ──────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:0] echo "Hello, $USER"
    color = rgba(136, 192, 208, 0.9)
    font-size   = 14
    font-family = JetBrains Mono
    position = 0, -110
    halign = center
    valign = center
}
