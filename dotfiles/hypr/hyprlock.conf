background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size    = 7
    brightness   = 0.4
    contrast     = 0.9
    vibrancy     = 0.15
    vibrancy_darkness = 0.2
}

# ── Card background ───────────────────────────────────────────────────────────

shape {
    monitor =
    size = 400, 420
    color = rgba(15, 10, 10, 0.55)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 180, 171, 0.2)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Clock ─────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%-I:%M %p")</b>"
    color = rgba(241, 222, 220, 1.0)
    font_size   = 72
    font_family = JetBrains Mono
    position = 0, 110
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %-d")"
    color = rgba(255, 180, 171, 0.85)
    font_size   = 16
    font_family = JetBrains Mono
    position = 0, 48
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size    = 0.28
    dots_spacing = 0.3
    outer_color  = rgba(255, 180, 171, 0.35)
    inner_color  = rgba(15, 10, 10, 0.6)
    font_color   = rgba(241, 222, 220, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    check_color  = rgba(224, 195, 140, 0.9)
    fail_color   = rgba(255, 100, 100, 0.9)
    fail_text    = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(224, 195, 140, 0.9)
    position = 0, -60
    halign = center
    valign = center
    rounding = 14
}

# ── Greeting ──────────────────────────────────────────────────────────────────

label {
    monitor =
    text = Hi, $USER
    color = rgba(241, 222, 220, 0.5)
    font_size   = 13
    font_family = JetBrains Mono
    position = 0, -118
    halign = center
    valign = center
}
